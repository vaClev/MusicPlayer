version: '3.8'

services:
  # Сервис базы данных PostgreSQL
  music-db:
    image: postgres:17
    container_name: music_postgres
    environment:
      POSTGRES_DB: MusicDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "5435:5432"  # Проброс порта для внешних клиентов (pgAdmin, DBeaver)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - music_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Сервис вашего API приложения
  music-api:
    build:
      context: ./MusicServer/MusicServer.API
      dockerfile: Dockerfile
    container_name: music_api
    depends_on:
      music-db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:5098
      - ConnectionStrings__DefaultConnection=Host=music-db;Port=5432;Database=MusicDb;Username=postgres;Password=${DB_PASSWORD:-postgres123}
      - DB_PASSWORD=${DB_PASSWORD:-postgres123}
    ports:
      - "5098:5098"  # HTTP порт
      - "7044:7044"  # HTTPS порт (если нужен)
    volumes:
      - music_uploads:/app/data
    networks:
      - music_network
    restart: unless-stopped

# Тома для хранения данных
volumes:
  postgres_data:
    driver: local
  music_uploads:
    driver: local

# Сеть для взаимодействия сервисов
networks:
  music_network:
    driver: bridge