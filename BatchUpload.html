<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пакетная загрузка музыки</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            color: #333;
        }
        h1 {
            color: #667eea;
            margin-top: 0;
        }
        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9ff;
        }
        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f3ff;
        }
        .upload-area.dragover {
            border-color: #4CAF50;
            background: #e8f5e9;
        }
        .file-list {
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }
        .file-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 5px;
            margin-bottom: 5px;
        }
        .file-item .name {
            flex: 1;
            margin-right: 10px;
        }
        .file-item .size {
            color: #666;
            font-size: 0.9em;
            margin-right: 10px;
        }
        .file-item .remove {
            color: #f44336;
            cursor: pointer;
            font-weight: bold;
        }
        .progress-container {
            margin-top: 20px;
            display: none;
        }
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #45a049);
            color: white;
            line-height: 30px;
            text-align: center;
            transition: width 0.3s;
        }
        .results {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 5px;
            display: none;
        }
        .success-item {
            color: #4CAF50;
            padding: 5px;
        }
        .error-item {
            color: #f44336;
            padding: 5px;
        }
        .btn {
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 20px;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 10px;
            color: white;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Пакетная загрузка музыки</h1>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="totalSelected">0</div>
                <div class="stat-label">Выбрано</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalSize">0 MB</div>
                <div class="stat-label">Общий размер</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="maxSize">500 MB</div>
                <div class="stat-label">Максимум</div>
            </div>
        </div>

        <div class="upload-area" id="uploadArea">
            <input type="file" id="fileInput" multiple accept=".mp3,.wav,.flac,.aac,.ogg,.m4a" style="display: none;">
            <p>📁 Нажмите или перетащите файлы сюда</p>
        </div>

        <div class="file-list" id="fileList"></div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill">0%</div>
            </div>
        </div>

        <button class="btn" id="uploadBtn" disabled>Загрузить выбранные файлы</button>

        <div class="results" id="results"></div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const uploadBtn = document.getElementById('uploadBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const results = document.getElementById('results');
        const totalSelected = document.getElementById('totalSelected');
        const totalSize = document.getElementById('totalSize');

        let selectedFiles = [];

        // Обработчики для drag & drop
        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        function handleFiles(files) {
            const newFiles = Array.from(files).filter(file => {
                const ext = '.' + file.name.split('.').pop().toLowerCase();
                return ['.mp3', '.wav', '.flac', '.aac', '.ogg', '.m4a'].includes(ext);
            });

            selectedFiles = [...selectedFiles, ...newFiles];
            updateFileList();
        }

        function updateFileList() {
            fileList.innerHTML = '';
            let totalSizeBytes = 0;

            selectedFiles.forEach((file, index) => {
                totalSizeBytes += file.size;
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <span class="name">${file.name}</span>
                    <span class="size">${(file.size / (1024*1024)).toFixed(2)} MB</span>
                    <span class="remove" onclick="removeFile(${index})">✕</span>
                `;
                fileList.appendChild(item);
            });

            totalSelected.textContent = selectedFiles.length;
            totalSize.textContent = (totalSizeBytes / (1024*1024)).toFixed(2) + ' MB';
            uploadBtn.disabled = selectedFiles.length === 0;
        }

        window.removeFile = (index) => {
            selectedFiles.splice(index, 1);
            updateFileList();
        };

        uploadBtn.addEventListener('click', async () => {
            if (selectedFiles.length === 0) return;

            const formData = new FormData();
            selectedFiles.forEach(file => {
                formData.append('files', file);
            });

            progressContainer.style.display = 'block';
            uploadBtn.disabled = true;

            try {
                //Сюда указать API куда отправляем файлы
                const response = await fetch('http://127.0.0.1:5098/api/music/upload/batch', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                
                progressFill.style.width = '100%';
                progressFill.textContent = '100%';

                displayResults(result);
            } catch (error) {
                alert('Ошибка загрузки: ' + error.message);
            } finally {
                progressContainer.style.display = 'none';
                uploadBtn.disabled = false;
                progressFill.style.width = '0%';
                progressFill.textContent = '0%';
            }
        });

        function displayResults(result) {
            results.style.display = 'block';
            
            let html = '<h3>Результаты загрузки:</h3>';
            html += `<p>Всего обработано: ${result.totalProcessed}</p>`;
            html += `<p>✅ Успешно: ${result.successCount}</p>`;
            html += `<p>❌ Ошибок: ${result.errorCount}</p>`;

            if (result.results && result.results.length > 0) {
                html += '<h4>Успешно загружены:</h4>';
                result.results.forEach(item => {
                    html += `<div class="success-item">✅ ${item.title} - ${item.artist || 'Unknown'}</div>`;
                });
            }

            if (result.errors && result.errors.length > 0) {
                html += '<h4>Ошибки:</h4>';
                result.errors.forEach(error => {
                    html += `<div class="error-item">❌ ${error.fileName}: ${error.error}</div>`;
                });
            }

            results.innerHTML = html;

            // Очищаем список после успешной загрузки
            if (result.errorCount === 0) {
                selectedFiles = [];
                updateFileList();
            }
        }
    </script>
</body>
</html>
